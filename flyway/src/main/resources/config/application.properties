logging.config=classpath:config/logback-dev.xml
server.port=8080

server.max-http-header-size=20971520

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# 生产/本地演示连 MySQL; 测试里会被 @SpringBootTest 的属性覆盖成内嵌 H2
spring.datasource.url=jdbc:mysql://ip:3306/flyway_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
spring.datasource.username=你的账号
spring.datasource.password=你的密码
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 已有数据库且里面已经有表时, 需要 baseline 才能让 flyway 接管, 这里保险起见直接开启
spring.flyway.baseline-on-migrate=true